<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after { box-sizing:inherit; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body {
    margin:0; min-height:100vh; color:#35393D;
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background-color:#FFFDF6;
    background-image:linear-gradient(#DCE8F2 1px, transparent 1px);
    background-size:100% 34px;
  }
  @media (min-width:900px){
    body::before { content:''; position:fixed; top:0; bottom:0; left:44px; width:2px; background:#F2B8B1; z-index:0; pointer-events:none; }
  }
  #app { position:relative; z-index:1; }
  .font-jua { font-family:Jua,"Gowun Dodum",sans-serif; }
  .font-pen { font-family:"Nanum Pen Script",cursive; }

  /* 칠판 */
  .chalkboard { background:#2F5D50; background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:6px 6px; color:#F3F7F1; border-bottom:6px solid #B9875A; }
  .chalk-text { text-shadow:0 0 1px rgba(255,255,255,.6); letter-spacing:.02em; }

  /* 버튼: 두꺼운 스티커 느낌 */
  .btn { font-family:Jua,"Gowun Dodum",sans-serif; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
    border:2px solid #35393D; border-radius:14px; padding:.6rem 1.1rem; background:#fff; color:#35393D;
    box-shadow:0 3px 0 #35393D; transition:transform .08s, box-shadow .08s; cursor:pointer; font-size:1.02rem; line-height:1.2; user-select:none; }
  .btn:active { transform:translateY(3px); box-shadow:0 0 0 #35393D; }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:0 3px 0 #35393D; }
  .btn-board { background:#2F5D50; color:#fff; }
  .btn-hl { background:#FFE36E; }
  .btn-pen { background:#E0453A; color:#fff; }
  .btn-sky { background:#3E86BC; color:#fff; }
  .btn-sm { padding:.35rem .7rem; font-size:.9rem; border-radius:10px; box-shadow:0 2px 0 #35393D; }
  .btn-sm:active { transform:translateY(2px); }
  .btn-ghost { border:none; box-shadow:none; background:transparent; text-decoration:underline; padding:.3rem .4rem; }
  .btn-ghost:active { transform:none; }
  :focus-visible { outline:3px solid #3E86BC; outline-offset:2px; }

  /* 종이/공책 패널 */
  .sheet { background:#fff; border:2px solid #35393D; border-radius:18px; position:relative; }
  .sheet-soft { background:#fff; border:1.5px solid #CBD5CF; border-radius:14px; }
  .tape::before { content:''; position:absolute; top:-12px; left:50%; width:96px; height:24px; transform:translateX(-50%) rotate(-2deg);
    background:rgba(255,227,110,.85); border-left:2px dashed rgba(0,0,0,.08); border-right:2px dashed rgba(0,0,0,.08); }
  .field { width:100%; border:2px solid #35393D; border-radius:12px; padding:.6rem .8rem; font-size:1rem; background:#fff; font-family:inherit; }
  .field:focus { outline:none; border-color:#3E86BC; box-shadow:0 0 0 3px rgba(62,134,188,.25); }
  .label { font-family:Jua,sans-serif; font-size:.95rem; display:block; margin-bottom:.3rem; }
  .chip { display:inline-flex; align-items:center; gap:.25rem; padding:.15rem .55rem; border-radius:999px; font-size:.8rem; border:1.5px solid currentColor; white-space:nowrap; }
  .tab { font-family:Jua,sans-serif; padding:.5rem .9rem; border-radius:12px 12px 0 0; border:2px solid transparent; border-bottom:none; color:#6b7280; cursor:pointer; background:transparent; white-space:nowrap; }
  .tab.on { background:#fff; color:#35393D; border-color:#35393D; position:relative; top:2px; }
  .seg { display:inline-flex; border:2px solid #35393D; border-radius:12px; overflow:hidden; }
  .seg button { font-family:Jua,sans-serif; padding:.4rem .8rem; background:#fff; border-right:2px solid #35393D; cursor:pointer; }
  .seg button:last-child { border-right:none; }
  .seg button.on { background:#FFE36E; }

  /* 원고지 */
  .wongoji { display:flex; flex-wrap:wrap; padding-left:1px; padding-top:1px; }
  .wongoji .cell { width:2.15rem; height:2.15rem; margin-left:-1px; margin-top:-1px; border:1.5px solid #7DB38A; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:1.25rem; font-family:"Gowun Dodum",sans-serif; color:#35393D; }
  .wongoji.small .cell { width:1.7rem; height:1.7rem; font-size:1rem; }
  .wongoji .cell.bad { background:#FFE1DC; color:#C0392B; border-color:#E0453A; position:relative; z-index:1; font-weight:bold; }
  .wongoji .cell.badspace { background:repeating-linear-gradient(45deg,#FFE1DC 0 4px,#fff 4px 8px); border-color:#E0453A; position:relative; z-index:1; }
  .wongoji .cell.ghost { color:#c3cfc7; }
  @media (max-width:420px){ .wongoji .cell { width:1.85rem; height:1.85rem; font-size:1.1rem; } }

  /* 빨간펜 채점 표시 */
  .redmark { position:absolute; pointer-events:none; }
  .redmark path, .redmark circle { fill:none; stroke:#E0453A; stroke-width:7; stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400; animation:draw .45s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .score-pen { font-family:"Nanum Pen Script",cursive; color:#E0453A; line-height:1; }

  .hl-under { background:linear-gradient(transparent 58%, #FFE36E 58%); padding:0 .1em; }
  .blank { display:inline-block; min-width:3.2em; border-bottom:3px solid #35393D; margin:0 .2em; text-align:center; color:#3E86BC; }

  /* 토스트/모달 */
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast { font-family:Jua,sans-serif; background:#35393D; color:#fff; padding:.65rem 1.1rem; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.2); animation:pop .2s ease-out; max-width:90vw; text-align:center; }
  .toast.err { background:#E0453A; } .toast.ok { background:#2F5D50; }
  @keyframes pop { from { transform:translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
  #modal { position:fixed; inset:0; z-index:70; display:none; align-items:flex-end; justify-content:center; background:rgba(34,70,60,.45); padding:12px; }
  #modal.open { display:flex; }
  @media (min-width:640px){ #modal { align-items:center; } }
  #modal .box { width:100%; max-width:560px; max-height:88vh; overflow:auto; animation:pop .18s ease-out; }
  #modal .box.wide { max-width:860px; }

  .timer-track { height:14px; border:2px solid #35393D; border-radius:999px; overflow:hidden; background:#fff; }
  .timer-fill { height:100%; background:#5FA86A; transition:width .05s linear; }
  .shake { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table.tbl { width:100%; border-collapse:collapse; font-size:.92rem; }
  table.tbl th { font-family:Jua,sans-serif; font-weight:normal; text-align:left; padding:.5rem; border-bottom:2px solid #35393D; white-space:nowrap; }
  table.tbl td { padding:.5rem; border-bottom:1px dashed #CBD5CF; vertical-align:middle; }
  .tile { text-align:left; cursor:pointer; transition:transform .12s; }
  .tile:hover { transform:rotate(-.6deg) translateY(-2px); }
  .stamp { font-family:Jua,sans-serif; color:#E0453A; border:2.5px solid #E0453A; border-radius:999px; padding:.05rem .5rem; transform:rotate(-10deg); display:inline-block; font-size:.8rem; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } .redmark path,.redmark circle{ stroke-dashoffset:0; } }
</style>
</head>

const CARDS = [
 {id:'c01',g:5,l:2,t:'되 / 돼',s:'‘돼’는 ‘되어’를 줄인 말',

 {id:'c05',g:6,l:3,t:'맞히다 / 맞추다',s:'정답은 ‘맞히다’, 조각은 ‘맞추다’',

<script>
/* =====================================================================
   공용 함수
===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const vals = o => o ? Object.entries(o).map(([k,v]) => ({ ...v, _id:k })) : [];
const fmtDate = t => { if(!t) return '-'; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const fmtDay = t => { const d=new Date(t); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
function hashKey(s){ let h=5381; for(const ch of s) h=((h<<5)+h+ch.codePointAt(0))|0; return 'k'+(h>>>0).toString(36); }
function pwHash(v){ let h='spell#admin#'+v; for(let i=0;i<3000;i++) h=hashKey(h+'#'+i+'#'+h.length); return h; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
function maskName(n){ n=String(n||''); if(n.length<=1) return n; if(n.length===2) return n[0]+'*'; return n[0]+'*'.repeat(n.length-2)+n[n.length-1]; }
const normSchool = s => String(s||'').replace(/\s+/g,'');
function classLabel(c){ return c ? `${c.region} ${c.school} ${c.grade}학년 ${c.ban}반` : '소속 반 없음'; }
function fillBlank(s, word){ return s.replace(/\( \)/g, word); }
function blankHtml(s, word='?'){ return esc(s).replace(/\( \)/g, `<span class="blank">${esc(word)}</span>`); }

/* 받아쓰기 비교: 문장부호는 무시, 띄어쓰기는 채점 */
function normAnswer(s){ return String(s||'').replace(/[.,!?~·…'"“”‘’]/g,'').replace(/\s+/g,' ').trim(); }
function isSame(a,b){ return normAnswer(a) === normAnswer(b); }
/* 정답 문장 중 학생 답과 맞지 않는 글자 위치 (LCS) */
function diffBad(answer, typed){
  const A=[...normAnswer(answer)], B=[...normAnswer(typed)], n=A.length, m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ok=new Set(); let i=0,j=0;
  while(i<n && j<m){ if(A[i]===B[j]){ ok.add(i); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const bad=new Set(); A.forEach((_,k)=>{ if(!ok.has(k)) bad.add(k); }); return bad;
}
/* 원고지 칸 그리기 */
function wongoji(text, bad=null, small=false, ghost=false){
  const chars=[...(bad ? normAnswer(text) : String(text||''))];
  if(!chars.length) return `<div class="wongoji ${small?'small':''}">${'<span class="cell ghost"></span>'.repeat(8)}</div>`;
  return `<div class="wongoji ${small?'small':''}" aria-label="${esc(text)}">` + chars.map((c,k)=>{
    const isBad = bad && bad.has(k);
    if(c===' ') return `<span class="cell ${isBad?'badspace':''}" title="${isBad?'여기를 띄어 써요':''}"></span>`;
    return `<span class="cell ${isBad?'bad':''} ${ghost?'ghost':''}">${esc(c)}</span>`;
  }).join('') + `</div>`;
}
/* 빨간펜 O / X */
function penMark(ok, size=64){
  return ok
   ? `<svg class="redmark" width="${size}" height="${size}" viewBox="0 0 100 100" style="left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg)"><circle cx="50" cy="50" r="38"/></svg>`
   : `<svg class="redmark" width="${size}" height="${size}" viewBox="0 0 100 100" style="left:50%;top:50%;transform:translate(-50%,-50%)"><path d="M22 22 L78 78"/><path d="M78 22 L22 78" style="animation-delay:.2s"/></svg>`;
}

/* =====================================================================
   저장소: localStorage를 기본으로 쓰고, Firebase가 연결되면 함께 저장
===================================================================== */
const LS_DATA='spellApp_v1_data', LS_SESSION='spellApp_v1_session', LS_PREF='spellApp_v1_pref';
const Store = {
  tree:{}, fb:null, connected:false,
  init(){
    try { this.tree = JSON.parse(localStorage.getItem(LS_DATA)||'{}') || {}; } catch(e){ this.tree = {}; }
    return new Promise(resolve=>{
      if(!APP.USE_FIREBASE || typeof firebase==='undefined'){ resolve(); return; }
      try{
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
        this.fb = firebase.database(app);
        let done=false;
        this.fb.ref('.info/connected').on('value', s=>{
          this.connected = !!s.val(); updateBadge();
          if(this.connected && !done){ done=true; resolve(); }
        });
        setTimeout(()=>{ if(!done){ done=true; resolve(); } }, 4000);
      }catch(e){ console.warn('Firebase 사용 안 함', e); this.fb=null; resolve(); }
    });
  },
  get cloud(){ return !!(this.fb && this.connected); },
  ks(p){ return String(p).split('/').filter(Boolean); },
  lget(p){ let n=this.tree; for(const k of this.ks(p)){ if(n==null||typeof n!=='object') return null; n=n[k]; } return n===undefined?null:n; },
  lset(p,v){
    const ks=this.ks(p); let n=this.tree;
    for(let i=0;i<ks.length-1;i++){ if(typeof n[ks[i]]!=='object'||n[ks[i]]===null) n[ks[i]]={}; n=n[ks[i]]; }
    if(v==null) delete n[ks[ks.length-1]]; else n[ks[ks.length-1]]=v;
    return this.save();
  },
  save(){ try{ localStorage.setItem(LS_DATA, JSON.stringify(this.tree)); return true; } catch(e){ return false; } },
  skipLocal(p){ return p.startsWith('photos') && this.cloud; }, // 클라우드 연결 시 사진은 기기에 쌓지 않음
  ref(p){ return this.fb.ref(APP.ROOT+'/'+p); },
  async get(p){
    if(this.cloud){
      try{ const snap=await withTimeout(this.ref(p).once('value'),7000); const v=snap.val(); if(!this.skipLocal(p)) this.lset(p,v); return v; }
      catch(e){ console.warn('클라우드 읽기 실패 → 기기 저장본 사용', p, e.message); }
    }
    return clone(this.lget(p));
  },
  async set(p,v){
    v = clone(v);
    const ok = this.skipLocal(p) ? true : this.lset(p,v);
    if(this.fb){
      const pr=this.ref(p).set(v);
      if(this.connected){ try{ await withTimeout(pr,7000); return true; }catch(e){ console.warn('클라우드 저장 실패',p,e.message); } }
      else pr.catch(()=>{});
    }
    return ok;
  },
  async update(p,obj){
    obj = clone(obj);
    for(const k in obj) this.lset(p+'/'+k, obj[k]);
    if(this.fb){
      const pr=this.ref(p).update(obj);
      if(this.connected){ try{ await withTimeout(pr,7000); }catch(e){ console.warn(e.message); } } else pr.catch(()=>{});
    }
  },
  async remove(p){ return this.set(p,null); },
  async resetAll(){ this.tree={}; this.save(); if(this.fb){ try{ await withTimeout(this.fb.ref(APP.ROOT).remove(),7000); }catch(e){} } }
};

/* =====================================================================
   음성 읽기 (Web Speech API)
===================================================================== */
const TTS = {
  voices:[], voice:null, rate:0.85, repeat:2, timer:null,
  ok: 'speechSynthesis' in window,
  init(){
    if(!this.ok) return;
    try{ const p=JSON.parse(localStorage.getItem(LS_PREF)||'{}'); if(p.rate) this.rate=p.rate; if(p.repeat) this.repeat=p.repeat; this.voiceName=p.voice; }catch(e){}
    const pick=()=>{
      this.voices = speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith('ko'));
      const prefer = ['Natural','Google','Yuna','유나','SunHi','Heami','InJoon','Sora'];
      this.voice = this.voices.find(v=>v.name===this.voiceName)
        || prefer.map(n=>this.voices.find(v=>v.name.includes(n))).find(Boolean) || this.voices[0] || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  savePref(){ localStorage.setItem(LS_PREF, JSON.stringify({rate:this.rate, repeat:this.repeat, voice:this.voice?.name})); },
  stop(){ this.run=null; if(!this.ok) return; clearTimeout(this.timer); speechSynthesis.cancel(); },
  one(text){ return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; if(this.voice) u.voice=this.voice; u.rate=this.rate; u.pitch=1;
    u.onend=res; u.onerror=res; speechSynthesis.speak(u);
  }); },
  async say(texts, gap=1200){
    if(!this.ok){ toast('이 브라우저는 음성 읽기를 지원하지 않아요. 크롬이나 사파리를 써 주세요.','err'); return; }
    this.stop(); const myRun = this.run = Symbol();
    for(const t of texts){
      if(this.run!==myRun) return;
      if(t===null){ await new Promise(r=>this.timer=setTimeout(r,gap)); continue; }
      await this.one(t);
    }
  },
  /* 받아쓰기용: 문장을 정해진 횟수만큼 읽기 */
  dictate(text, num=null){
    const seq=[]; if(num) { seq.push(num+'번.'); seq.push(null); }
    for(let i=0;i<this.repeat;i++){ seq.push(text); if(i<this.repeat-1) seq.push(null); }
    return this.say(seq, 1400);
  }
};

/* 효과음 */
let actx=null;
function sfx(type){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.connect(g); g.connect(actx.destination); const t=actx.currentTime;
    if(type==='ok'){ o.frequency.setValueAtTime(587,t); o.frequency.setValueAtTime(880,t+.08); g.gain.setValueAtTime(.18,t); g.gain.linearRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }
    else if(type==='no'){ o.type='sawtooth'; o.frequency.setValueAtTime(160,t); g.gain.setValueAtTime(.15,t); g.gain.linearRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }
    else { o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(760,t+.12); g.gain.setValueAtTime(.12,t); g.gain.linearRampToValueAtTime(.001,t+.15); o.start(t); o.stop(t+.15); }
  }catch(e){}
}

function toast(msg, type=''){
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; $('#toast').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* 사진 줄이기 (저장 공간 아끼기) */
function compressImage(file, max=900, q=0.6){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없어요')); };
    img.src=url;
  });
}

async function loadMe(){
  const st=await Store.get('students/'+S.id);
  if(!st){ toast('계정 정보를 찾을 수 없어요. 다시 로그인해 주세요.','err'); logout(); return false; }
  S.me={...st, id:S.id};
  S.cls = st.classId ? await Store.get('classes/'+st.classId) : null;
  return true;
}
</script>

<script>
/* =====================================================================
   학생 화면
===================================================================== */
const STUDENT_TABS = [ ['home','🏠','홈'], ['dict','📝','받아쓰기'], ['learn','📚','맞춤법 카드'], ['wrong','📒','오답노트'], ['battle','⚡','실시간 대결'] ];
function studentShell(inner){
  const right = `<span class="font-jua text-[#FFE36E]">${esc(S.me?.name||'')}</span><button class="btn btn-sm" onclick="logout()">로그아웃</button>`;
  return topBar('학생', right) + `
  <nav class="bg-[#22463C] sticky top-0 z-20" style="top:env(safe-area-inset-top,0px)">
    <div class="max-w-5xl mx-auto px-2 flex gap-1 scroll-x">
      ${STUDENT_TABS.map(([k,ic,n])=>`<button class="font-jua px-3 py-2.5 whitespace-nowrap ${S.view===k?'text-[#2F5D50] bg-[#FFE36E] rounded-t-lg mt-1':'text-[#d8e7dd]'}" onclick="studentGo('${k}')">${ic} ${n}</button>`).join('')}
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-20" id="stMain">${inner}</main>`;
}
function studentGo(v){ TTS.stop(); stopTimer(); S.view=v; if(v==='dict' && S.dict?.phase==='done') S.dict=null; if(v==='battle') QZ.phase='intro'; render(); window.scrollTo(0,0); }
async function renderStudent(){
  const app=$('#app');
  if(!S.me){ app.innerHTML = studentShell(loading()); if(!(await loadMe())) return; }
  const views={ home:viewStudentHome, dict:viewDict, learn:viewLearn, wrong:viewWrong, battle:viewBattle };
  app.innerHTML = studentShell(loading());
  updateBadge();
  const html = await (views[S.view]||viewStudentHome)();
  if(S.screen!=='student') return;
  $('#stMain').innerHTML = html;
  afterStudentRender();
}
function afterStudentRender(){ if(S.view==='battle' && QZ.phase==='play') startQTimer(); }

/* ---------- 홈 ---------- */
async function viewStudentHome(){
  const [recs, wrong, rank] = await Promise.all([ Store.get('records/'+S.id), Store.get('wrong/'+S.id), Store.get('rank/'+S.id) ]);
  const list = vals(recs).sort((a,b)=>b.at-a.at);
  const dicts = list.filter(r=>r.type==='dictation');
  const avg = dicts.length ? Math.round(dicts.reduce((s,r)=>s+(r.score||0),0)/dicts.length) : 0;
  const learned = Object.keys((await Store.get('learned/'+S.id))||{}).length;
  const daily = await Store.get('daily/'+S.id); const dToday = daily && daily.date===todayStr() ? daily : null;
  const dDone = dToday ? (dToday.cards||[]).filter(c=>(dToday.done||{})[c]).length : 0;
  const todayDone = dicts.some(r=>fmtDay(r.at)===fmtDay(Date.now()));
  const stat = (n,l,sub='') => `<div class="sheet-soft p-4"><div class="font-jua text-3xl">${n}</div><div class="text-sm text-gray-600">${l}</div>${sub?`<div class="text-xs text-gray-500 mt-1">${sub}</div>`:''}</div>`;
  return `
  <section class="flex flex-wrap items-end gap-3 mb-6">
    <div>
      <p class="text-gray-600">${esc(classLabel(S.cls))}</p>
      <h2 class="font-jua text-4xl">${esc(S.me.name)}의 맞춤법 공책</h2>
    </div>
    ${todayDone?'<span class="stamp ml-auto text-base">오늘 받아쓰기 완료</span>':''}
  </section>
  ${!S.cls?'<div class="sheet-soft p-4 mb-5 bg-[#FFF4D6]">소속 반이 삭제되었어요. 학습은 계속할 수 있지만 반 순위에는 보이지 않아요.</div>':''}
  <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
    ${stat(dicts.length+'번','받아쓰기 한 횟수', dicts.length?`평균 ${avg}점`:'')}
    ${stat(Object.keys(wrong||{}).length+'개','오답노트에 남은 문제')}
    ${stat(learned+' / '+CARDS.length,'익힌 맞춤법 카드')}
    ${stat((rank?.best||0).toLocaleString()+'점','대결 최고 점수', rank?.plays?`${rank.plays}번 도전`:'')}
  </section>
  <section class="grid sm:grid-cols-2 gap-4 mb-10">
    ${[
      ['dict','📝','매일 받아쓰기', todayDone?'오늘 한 번 더 해 볼까요?':'오늘의 다섯 문장을 들어 봐요.','bg-white'],
      ['learn','☀️','오늘의 맞춤법 카드', dToday ? (dDone>=(dToday.cards||[]).length ? `오늘 카드 완료! 🔥 ${dToday.streak||1}일 연속` : `오늘 ${dDone}/${(dToday.cards||[]).length}장 통과 · 이어서 공부해요.`) : '오늘의 카드 5장이 기다려요.', 'bg-[#FFF4D6]'],
      ['wrong','📒','오답노트','틀린 문제만 모아 다시 시험 봐요.','bg-white'],
      ['battle','⚡','실시간 대결','20문제! 빨리 맞힐수록 점수가 올라가요.','bg-white']
    ].map(([k,ic,t,d,bg])=>`<button class="sheet tile p-5 ${bg}" onclick="studentGo('${k}')"><div class="flex items-center gap-3"><span class="text-4xl">${ic}</span><span class="font-jua text-2xl">${t}</span></div><p class="text-gray-600 mt-2">${d}</p></button>`).join('')}
  </section>
  <section>
    <h3 class="font-jua text-2xl mb-3">최근 기록</h3>
    ${list.length ? `<div class="sheet-soft divide-y divide-dashed">${list.slice(0,8).map(r=>`
      <div class="flex items-center gap-3 px-4 py-3">
        <span class="text-xl">${r.type==='quiz'?'⚡':'📝'}</span>
        <span class="flex-1">${r.type==='quiz'?`실시간 대결 · ${r.correct}/${r.total} 정답`:`받아쓰기 · ${r.correct}/${r.total} 맞음`}</span>
        <span class="font-jua ${r.type==='quiz'?'':'text-[#E0453A]'}">${(r.score||0).toLocaleString()}점</span>
        <span class="text-sm text-gray-500 w-24 text-right">${fmtDate(r.at)}</span>
      </div>`).join('')}</div>` : `<p class="text-gray-600">아직 기록이 없어요. 받아쓰기부터 시작해 볼까요?</p>`}
  </section>`;
}

/* =====================================================================
   ① 매일 받아쓰기
===================================================================== */
function getRecentDict(){ try{ return JSON.parse(localStorage.getItem('spellApp_v1_recent_'+S.id)||'[]'); }catch(e){ return []; } }
function pushRecentDict(arr){ const r=[...arr, ...getRecentDict()].slice(0,40); localStorage.setItem('spellApp_v1_recent_'+S.id, JSON.stringify(r)); }
function viewDict(){
  const d=S.dict;
  if(!d) return viewDictSetup();
  if(d.phase==='listen') return viewDictListen();
  if(d.phase==='grade') return viewDictGrade();
  return viewDictDone();
}
function viewDictSetup(){
  const custom = (S.cls?.custom||[]).filter(Boolean);
  const lv = S.dictLevel || 'all';
  return `
  <div class="max-w-2xl">
    <h2 class="font-jua text-4xl mb-1">📝 매일 받아쓰기</h2>
    <p class="text-gray-600 mb-6">문제 5개를 들려줄게요. 공책에 또박또박 쓰고, 다 쓰면 사진을 찍어 채점해요.</p>
    <div class="sheet tape p-6 mb-5">
      <div class="font-jua text-xl mb-3">문제 고르기</div>
      <div class="seg mb-4" role="group" aria-label="난이도">
        ${[['all','골고루'],['1','짧은 문장'],['2','맞춤법 문장'],['3','긴 문장']].map(([k,n])=>`<button class="${lv===k?'on':''}" onclick="S.dictLevel='${k}';render()">${n}</button>`).join('')}
      </div>
      <div class="flex flex-wrap gap-3">
        <button class="btn btn-board text-lg" onclick="startDict('basic')">🎲 기본 문제로 시작</button>
        ${custom.length?`<button class="btn btn-hl text-lg" onclick="startDict('teacher')">🍎 선생님이 낸 문제 (${custom.length}개)</button>`:''}
      </div>
    </div>
    <details class="sheet-soft p-4">
      <summary class="font-jua cursor-pointer">🔊 목소리 설정</summary>
      ${voiceSettings()}
    </details>
  </div>`;
}
function voiceSettings(){
  if(!TTS.ok) return '<p class="mt-3 text-[#E0453A]">이 브라우저는 음성 읽기를 지원하지 않아요.</p>';
  return `<div class="grid sm:grid-cols-3 gap-3 mt-3">
    <label><span class="label text-sm">빠르기</span>
      <select class="field" onchange="TTS.rate=+this.value;TTS.savePref()">${[[0.7,'천천히'],[0.85,'보통'],[1,'조금 빠르게']].map(([v,n])=>`<option value="${v}" ${TTS.rate==v?'selected':''}>${n}</option>`).join('')}</select></label>
    <label><span class="label text-sm">읽는 횟수</span>
      <select class="field" onchange="TTS.repeat=+this.value;TTS.savePref()">${[1,2,3].map(v=>`<option value="${v}" ${TTS.repeat==v?'selected':''}>${v}번씩</option>`).join('')}</select></label>
    <label><span class="label text-sm">목소리</span>
      <select class="field" onchange="TTS.voice=TTS.voices.find(v=>v.name===this.value)||null;TTS.savePref()">${TTS.voices.length?TTS.voices.map(v=>`<option ${TTS.voice?.name===v.name?'selected':''}>${esc(v.name)}</option>`).join(''):'<option>기본 한국어 목소리</option>'}</select></label>
  </div>
  <button class="btn btn-sm mt-3" onclick="TTS.say(['안녕하세요. 또박또박 맞춤법 교실입니다.'])">🔊 들어 보기</button>`;
}
function startDict(src){
  let pool;
  if(src==='teacher') pool=(S.cls?.custom||[]).filter(Boolean).map(t=>({t}));
  else { const lv=S.dictLevel||'all'; pool = lv==='all' ? DICTATION : DICTATION.filter(x=>String(x.l)===lv); }
  const recent=new Set(getRecentDict());
  let fresh=pool.filter(x=>!recent.has(x.t)); if(fresh.length<5) fresh=pool;
  const items=shuffle(fresh).slice(0,5).map(x=>({t:x.t, typed:'', ok:null}));
  if(!items.length) return toast('문제가 없어요','err');
  S.dict={ src, items, phase:'listen', photo:null };
  render();
}
function viewDictListen(){
  const d=S.dict;
  return `
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <h2 class="font-jua text-3xl">📝 받아쓰기 ${d.src==='teacher'?'<span class="chip text-[#2F5D50] align-middle">선생님 문제</span>':''}</h2>
    <button class="btn btn-board ml-auto" onclick="playAllDict()">▶ 1번부터 끝까지 듣기</button>
    <button class="btn btn-sm" onclick="TTS.stop()">⏹ 멈춤</button>
  </div>
  <p class="text-gray-600 mb-5">🔊 버튼을 누르면 문제를 읽어 줘요. 공책에 쓴 뒤, 아래 칸에 똑같이 입력하면 <b>자동 채점</b>도 돼요(선택).</p>
  <div class="space-y-3 mb-6">
    ${d.items.map((it,i)=>`
    <div class="sheet-soft p-4">
      <div class="flex items-center gap-3 mb-3">
        <span class="font-jua text-3xl w-8 text-center">${i+1}</span>
        <button class="btn btn-sky btn-sm" onclick="TTS.dictate(S.dict.items[${i}].t)">🔊 듣기</button>
        <input class="field flex-1" value="${esc(it.typed)}" placeholder="공책에 쓴 그대로 입력 (선택)" oninput="dictType(${i},this.value)" aria-label="${i+1}번 답 입력" autocomplete="off" spellcheck="false">
      </div>
      <div id="wg${i}" class="pl-11 scroll-x">${wongoji(it.typed,null,true,!it.typed)}</div>
    </div>`).join('')}
  </div>
  ${photoBox()}
  <div class="flex flex-wrap gap-3 mt-6">
    <button class="btn" onclick="S.dict=null;render()">다른 문제로 바꾸기</button>
    <button class="btn btn-pen text-lg ml-auto" onclick="TTS.stop();S.dict.phase='grade';S.dict.items.forEach(it=>{ if(it.typed.trim()) it.ok=isSame(it.t,it.typed); });render();window.scrollTo(0,0)">✔ 다 썼어요! 채점하기</button>
  </div>`;
}
function photoBox(){
  const p=S.dict.photo;
  return `<div class="sheet p-5 bg-[#F3F7F1]">
    <div class="font-jua text-xl mb-1">📷 공책 사진 올리기</div>
    <p class="text-sm text-gray-600 mb-3">공책을 찍어 올리면 채점할 때 옆에 띄워 주고, 선생님도 볼 수 있어요.</p>
    <div class="flex flex-wrap gap-2 items-center">
      <label class="btn btn-sm cursor-pointer">📸 카메라로 찍기<input type="file" accept="image/*" capture="environment" class="hidden" onchange="dictPhoto(this)"></label>
      <label class="btn btn-sm cursor-pointer">🖼️ 사진 고르기<input type="file" accept="image/*" class="hidden" onchange="dictPhoto(this)"></label>
      ${p?`<button class="btn btn-sm" onclick="S.dict.photo=null;render()">사진 지우기</button>`:''}
    </div>
    ${p?`<img src="${p}" alt="올린 공책 사진" class="mt-3 max-h-56 rounded-lg border-2 border-ink cursor-zoom-in" onclick="showPhoto(S.dict.photo)">`:''}
  </div>`;
}
async function dictPhoto(input){
  const f=input.files?.[0]; if(!f) return;
  try{ S.dict.photo = await compressImage(f); toast('사진을 올렸어요','ok'); render(); }
  catch(e){ toast(e.message,'err'); }
}
function dictType(i,v){ S.dict.items[i].typed=v; const el=$('#wg'+i); if(el) el.innerHTML=wongoji(v,null,true,!v); }
function playAllDict(){
  const seq=[]; S.dict.items.forEach((it,i)=>{ seq.push((i+1)+'번.'); seq.push(null); for(let k=0;k<TTS.repeat;k++){ seq.push(it.t); seq.push(null); } seq.push(null); });
  TTS.say(seq, 1500);
}
function viewDictGrade(){
  const d=S.dict, done=d.items.filter(i=>i.ok!==null).length, right=d.items.filter(i=>i.ok).length;
  return `
  <div class="flex flex-wrap items-end gap-3 mb-2">
    <h2 class="font-jua text-3xl">✔ 채점하기</h2>
    <span class="ml-auto font-jua text-xl">${done}/5 채점 · <span class="text-[#E0453A]">${right*20}점</span></span>
  </div>
  <p class="text-gray-600 mb-5">공책과 정답을 한 글자씩 비교해 보고 <b>맞음/틀림</b>을 눌러요. 입력한 답이 있으면 미리 채점해 두었어요. 빨간 칸은 고쳐야 할 곳이에요.</p>
  <div class="grid lg:grid-cols-[1fr_300px] gap-5">
    <div class="space-y-3">
    ${d.items.map((it,i)=>{
      const bad = it.typed.trim() ? diffBad(it.t,it.typed) : null;
      return `<div class="sheet-soft p-4">
        <div class="flex items-start gap-3">
          <div class="relative w-14 h-14 flex-none flex items-center justify-center"><span class="font-jua text-3xl">${i+1}</span>${it.ok!==null?penMark(it.ok,64):''}</div>
          <div class="flex-1 min-w-0">
            <div class="scroll-x mb-2">${wongoji(it.t, bad)}</div>
            ${it.typed.trim()?`<div class="text-sm text-gray-600">내가 입력한 답: <span class="text-ink">${esc(it.typed)}</span> ${isSame(it.t,it.typed)?'<span class="text-[#2F5D50]">· 자동 채점: 같아요</span>':'<span class="text-[#E0453A]">· 자동 채점: 달라요</span>'}</div>`:''}
            <div class="flex flex-wrap gap-2 mt-3">
              <button class="btn btn-sm ${it.ok===true?'btn-board':''}" onclick="dictMark(${i},true)">⭕ 맞음</button>
              <button class="btn btn-sm ${it.ok===false?'btn-pen':''}" onclick="dictMark(${i},false)">❌ 틀림</button>
              <button class="btn btn-sm btn-ghost" onclick="TTS.dictate(S.dict.items[${i}].t)">🔊 다시 듣기</button>
            </div>
          </div>
        </div>
      </div>`; }).join('')}
    </div>
    <aside class="lg:sticky lg:top-16 self-start">
      ${d.photo?`<div class="sheet p-3"><div class="font-jua mb-2">내 공책</div><img src="${d.photo}" alt="공책 사진" class="w-full rounded-lg border-2 border-ink cursor-zoom-in" onclick="showPhoto(S.dict.photo)"><p class="text-xs text-gray-500 mt-2">사진을 누르면 크게 보여요.</p></div>`
        : photoBox()}
    </aside>
  </div>
  <div class="flex flex-wrap gap-3 mt-6">
    <button class="btn" onclick="S.dict.phase='listen';render()">← 다시 듣기 화면</button>
    <button class="btn btn-pen text-lg ml-auto" ${done<5?'disabled':''} onclick="saveDict()">💾 채점 결과 저장</button>
  </div>
  ${done<5?'<p class="text-right text-sm text-gray-500 mt-2">5문제를 모두 채점하면 저장할 수 있어요.</p>':''}`;
}
function dictMark(i,v){ S.dict.items[i].ok=v; v?sfx('ok'):sfx('no'); const y=window.scrollY; render(); requestAnimationFrame(()=>window.scrollTo(0,y)); }
async function addWrongs(sid, list){
  if(!list.length) return;
  const cur=(await Store.get('wrong/'+sid))||{}, upd={};
  for(const w of list){ const ex=cur[w.key]; upd[w.key] = ex ? {...ex, count:(ex.count||1)+1, at:Date.now()} : {...w.data, count:1, at:Date.now()}; }
  await Store.update('wrong/'+sid, upd);
}
const dictWrongKey = t => hashKey('d:'+normAnswer(t));
async function saveDict(){
  const d=S.dict; if(d.saving) return; d.saving=true;
  const correct=d.items.filter(i=>i.ok).length, rid=uid('r');
  const rec={ type:'dictation', at:Date.now(), src:d.src, total:5, correct, score:correct*20, hasPhoto:!!d.photo, items:d.items.map(i=>({t:i.t, typed:i.typed||'', ok:!!i.ok})) };
  await Store.set(`records/${S.id}/${rid}`, rec);
  if(d.photo){ const ok=await Store.set(`photos/${S.id}/${rid}`, d.photo); if(!ok) toast('기기 저장 공간이 부족해서 사진은 빼고 저장했어요','err'); }
  await addWrongs(S.id, d.items.filter(i=>!i.ok).map(i=>({ key:dictWrongKey(i.t), data:{kind:'dict', t:i.t} })));
  pushRecentDict(d.items.map(i=>i.t));
  d.phase='done'; d.result=rec; sfx('ok'); render(); window.scrollTo(0,0);
}
function viewDictDone(){
  const r=S.dict.result, wrong=r.items.filter(i=>!i.ok).length;
  const msg = r.score===100?'완벽해요! 한 글자도 안 틀렸어요.': r.score>=80?'아주 잘했어요! 틀린 문장만 다시 볼까요?': r.score>=60?'좋아요. 오답노트로 한 번 더 연습해요.':'괜찮아요. 오답노트에서 다시 도전해 봐요.';
  return `
  <div class="max-w-xl mx-auto text-center py-6">
    <div class="sheet tape p-8">
      <p class="font-jua text-xl text-gray-600">오늘의 받아쓰기</p>
      <div class="relative inline-block my-4 px-8">
        <span class="score-pen text-8xl">${r.score}</span><span class="score-pen text-4xl">점</span>
        ${r.score===100?'<svg class="redmark" width="230" height="150" viewBox="0 0 230 150" style="left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg)"><path d="M115 12 C 40 10, 8 50, 14 82 C 22 128, 120 145, 190 118 C 230 100, 225 40, 160 18 C 140 12, 120 12, 100 16" style="stroke-dasharray:700;stroke-dashoffset:700"/></svg>':''}
      </div>
      <p class="text-lg mb-6">${msg}</p>
      <div class="flex flex-wrap justify-center gap-3">
        ${wrong?`<button class="btn btn-hl" onclick="studentGo('wrong')">📒 오답노트 보기 (${wrong})</button>`:''}
        <button class="btn btn-board" onclick="S.dict=null;render()">한 번 더 하기</button>
        <button class="btn" onclick="studentGo('home')">홈으로</button>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   ② 맞춤법 학습 : 오늘의 카드(새 카드 + 복습) · 전체 카드 사전
   복습 간격: 맞히면 1일 → 3일 → 7일 → 14일 → 30일 → 60일 뒤에 다시 나와요.
===================================================================== */
const SRS_GAP=[1,3,7,14,30,60];
const DAILY_N=5;
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr=()=>dstr(new Date());
function addDays(ds,n){ const [y,m,d]=ds.split('-').map(Number); return dstr(new Date(y,m-1,d+n)); }
function prevSchoolDay(ds){ let p=addDays(ds,-1); for(let k=0;k<2;k++){ const [y,m,d]=p.split('-').map(Number); const w=new Date(y,m-1,d).getDay(); if(w===0||w===6) p=addDays(p,-1); } return p; }
const CARD_BY_ID=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const cardMix=id=>Math.imul(Number(id.slice(1))+7,2654435761)>>>0;
function cardOrder(){
  const g=S.cls?.grade||5;
  return [...CARDS].sort((a,b)=>((a.g>g)-(b.g>g)) || (a.l-b.l) || (cardMix(a.id)-cardMix(b.id)));
}
function pickDue(srs, t, exclude=[]){
  return Object.entries(srs).filter(([id,v])=>CARD_BY_ID[id] && v && v.due<=t && !exclude.includes(id))
    .sort((a,b)=>a[1].due.localeCompare(b[1].due)||(a[1].b||0)-(b[1].b||0)).map(([id])=>id);
}
async function getDaily(){
  const t=todayStr();
  let [d, srs]=await Promise.all([Store.get('daily/'+S.id), Store.get('srs/'+S.id)]); srs=srs||{};
  if(!d || d.date!==t){
    const due=pickDue(srs,t), fresh=cardOrder().filter(c=>!srs[c.id]).map(c=>c.id);
    let review=due.slice(0,3), nw=fresh.slice(0,DAILY_N-review.length);
    if(review.length+nw.length<DAILY_N) review=due.slice(0,DAILY_N-nw.length);
    let cards=[...review,...nw];
    if(cards.length<DAILY_N){ // 모든 카드를 다 배웠고 오늘 복습할 것도 없을 때: 가장 먼저 돌아올 카드
      const extra=Object.entries(srs).filter(([id])=>CARD_BY_ID[id]&&!cards.includes(id)).sort((a,b)=>a[1].due.localeCompare(b[1].due)).map(([id])=>id);
      review=[...review,...extra.slice(0,DAILY_N-cards.length)]; cards=[...review,...nw];
    }
    d={ date:t, cards, review, done:{}, streak:d?.streak||0, last:d?.last||'', total:d?.total||0 };
    await Store.set('daily/'+S.id, d);
  }
  d.cards=(d.cards||[]).filter(id=>CARD_BY_ID[id]); d.review=d.review||[]; d.done=d.done||{};
  return { d, srs };
}
async function srsMark(cid, ok){
  const t=todayStr(), cur=await Store.get(`srs/${S.id}/${cid}`);
  let v;
  if(ok){
    if(cur && cur.last===t && cur.b>0) v=cur; // 같은 날 여러 번 맞혀도 한 단계만 올라가요
    else { const b=Math.min((cur?.b||0)+1, SRS_GAP.length); v={ b, due:addDays(t,SRS_GAP[b-1]), last:t, n:(cur?.n||0)+1 }; }
    await Store.set(`learned/${S.id}/${cid}`, Date.now());
  } else v={ b:0, due:addDays(t,1), last:t, n:(cur?.n||0)+1 };
  await Store.set(`srs/${S.id}/${cid}`, v);
  const d=await Store.get('daily/'+S.id);
  if(ok && d && d.date===t && (d.cards||[]).includes(cid)){
    d.done=d.done||{}; if(d.done[cid]) return {};
    d.done[cid]=1;
    const all=d.cards.every(c=>d.done[c]);
    let complete=false;
    if(all && d.last!==t){ d.streak = (d.last===addDays(t,-1)||d.last===prevSchoolDay(t)) ? (d.streak||0)+1 : 1; d.last=t; d.total=(d.total||0)+1; complete=true; }
    await Store.set('daily/'+S.id, d);
    return { daily:true, complete, streak:d.streak };
  }
  return {};
}
async function moreDaily(){
  const { d, srs }=await getDaily(), t=todayStr();
  const fresh=cardOrder().filter(c=>!srs[c.id]&&!d.cards.includes(c.id)).map(c=>c.id);
  const add=fresh.slice(0,DAILY_N); if(add.length<DAILY_N) add.push(...pickDue(srs,t,[...d.cards,...add]).slice(0,DAILY_N-add.length));
  if(!add.length) return toast('더 공부할 카드가 없어요. 모든 카드를 익혔어요!','ok');
  d.cards=[...d.cards,...add]; d.review=[...d.review,...add.filter(id=>srs[id])];
  await Store.set('daily/'+S.id, d); toast(`카드 ${add.length}장을 더 받았어요`,'ok'); render();
}
function srsLevel(v){ if(!v) return 0; if((v.b||0)>=5) return 3; if((v.b||0)>=3) return 2; return 1; }
const SRS_LABEL=['아직 안 배움','익히는 중','거의 다 앎','완전히 앎'];

const CAT_NAME={A:'헷갈리는 짝꿍',B:'자주 틀리는 낱말',C:'받침·소리 규칙',D:'띄어쓰기',E:'외래어',F:'말끝 바르게'};

    </div>`:''}

    <div class="seg" role="group" aria-label="난이도">${[['all','전체'],['1','쉬움'],['2','보통'],['3','어려움']].map(([k,n])=>`<button class="${l===k?'on':''}" onclick="S.ll='${k}';render()">${n}</button>`).join('')}</div>
  </div>
  <div class="flex flex-wrap gap-2 mb-3">${[['all','모든 분류'],...Object.entries(CAT_NAME)].map(([k,n])=>`<button class="btn btn-sm ${cat===k?'btn-hl':''}" onclick="S.lc='${k}';render()">${n}</button>`).join('')}</div>
  <input class="field mb-4 max-w-sm" placeholder="🔍 낱말로 찾기 (예: 돼, 초콜릿)" value="${esc(S.lq||'')}" onchange="S.lq=this.value;render()">

  </div>

      <div class="score-pen text-8xl my-3">${ok}<span class="text-4xl"> / ${r.items.length}</span></div>
      <p class="text-lg mb-6">${ok===r.items.length?'모두 맞혔어요! 오답노트가 가벼워졌어요.':`맞힌 ${ok}문제는 오답노트에서 뺐어요.`}</p>
      <div class="flex justify-center gap-3"><button class="btn btn-board" onclick="S.rt=null;render()">오답노트로</button><button class="btn" onclick="S.rt=null;studentGo('home')">홈으로</button></div>
    </div>`;
  }
  const w=r.items[r.idx];
  const head=`<div class="flex items-center gap-3 mb-4"><button class="btn btn-sm" onclick="TTS.stop();S.rt=null;render()">그만하기</button><span class="font-jua text-xl ml-auto">${r.idx+1} / ${r.items.length}</span></div>`;
  if(w.kind==='dict'){
    setTimeout(()=>{ if(S.rt && !S.rt.answered && S.rt.items[S.rt.idx]===w && !w._played){ w._played=true; TTS.dictate(w.t); } },300);
    return head+`<div class="max-w-2xl mx-auto sheet tape p-6">
      <div class="font-jua text-2xl mb-3">🔊 듣고 그대로 써 보세요</div>
      <button class="btn btn-sky mb-4" onclick="TTS.dictate(S.rt.items[S.rt.idx].t)">🔊 다시 듣기</button>
      <input id="rtIn" class="field text-lg mb-3" autocomplete="off" spellcheck="false" ${r.answered?'disabled':''} value="${esc(w._typed||'')}"
        oninput="$('#rtWg').innerHTML=wongoji(this.value,null,true,!this.value)" onkeydown="if(event.key==='Enter'&&!event.isComposing)retestDict()">
      <div id="rtWg" class="scroll-x mb-4">${r.answered?wongoji(w.t, diffBad(w.t,w._typed||'')):wongoji(w._typed||'',null,true,true)}</div>
      ${r.answered?retestFeedback(w):`<button class="btn btn-pen w-full" onclick="retestDict()">확인</button>`}
    </div>`;
  }
  return head+`<div class="max-w-2xl mx-auto sheet tape p-6">
    <div class="font-jua text-2xl mb-4">바른 말을 골라요</div>
    <p class="text-2xl leading-relaxed mb-6">${blankHtml(w.s, r.answered?w.a:'?')}</p>
    <div class="grid grid-cols-2 gap-3 mb-4">${w.opts.map(o=>`<button class="btn text-xl py-4 ${r.answered?(o===w.a?'btn-board':''):''}" ${r.answered?'disabled':''} onclick='retestSpell(${JSON.stringify(o)})'>${esc(o)}</button>`).join('')}</div>
    ${r.answered?retestFeedback(w):''}
  </div>`;
}
function retestFeedback(w){
  const ok=S.rt.res[S.rt.idx];
  return `<div class="rounded-xl p-4 mb-3 ${ok?'bg-[#E4F1E6]':'bg-[#FFE1DC]'}">
    <div class="font-jua text-xl ${ok?'text-[#2F5D50]':'text-[#E0453A]'}">${ok?'⭕ 맞았어요! 오답노트에서 뺄게요.':'❌ 아직 헷갈려요'}</div>
    ${!ok?`<p class="mt-1">정답: <b>${esc(w.kind==='dict'?w.t:fillBlank(w.s,w.a))}</b></p>`:''}
  </div><button class="btn btn-board w-full" onclick="S.rt.idx++;S.rt.answered=false;render()">다음 문제</button>`;
}
async function retestDone(ok){
  const r=S.rt, w=r.items[r.idx]; r.res[r.idx]=ok; r.answered=true; ok?sfx('ok'):sfx('no');
  if(ok) await Store.remove(`wrong/${S.id}/${w._id}`);
  else await Store.update(`wrong/${S.id}/${w._id}`, {count:(w.count||1)+1, at:Date.now()});
  render();
}
function retestDict(){ const v=$('#rtIn').value; if(!v.trim()) return toast('들은 문장을 입력해 주세요','err'); const w=S.rt.items[S.rt.idx]; w._typed=v; TTS.stop(); retestDone(isSame(w.t,v)); }
function retestSpell(o){ const w=S.rt.items[S.rt.idx]; retestDone(o===w.a); }

/* =====================================================================
   ④ 실시간 대결
===================================================================== */
const QZ={ phase:'intro' };
let QT=null;
function stopTimer(){ if(QT){ clearInterval(QT); QT=null; } }
async function viewBattle(){
  if(QZ.phase==='intro') return viewBattleIntro();
  if(QZ.phase==='count') return `<div class="py-24 text-center"><div class="font-jua text-[9rem] leading-none text-[#2F5D50]" id="countNum">${QZ.count}</div><p class="font-jua text-xl text-gray-600 mt-4">준비!</p></div>`;
  if(QZ.phase==='play') return viewBattlePlay();
  return viewBattleEnd();
}
async function viewBattleIntro(){
  const r=await Store.get('rank/'+S.id);
  return `<div class="max-w-2xl mx-auto">
    <div class="sheet tape p-7 text-center">
      <div class="text-6xl mb-2">⚡</div>
      <h2 class="font-jua text-4xl">맞춤법 실시간 대결</h2>
      <p class="text-gray-600 mt-2 mb-6">문제는 ${APP.QUIZ_COUNT}개, 한 문제에 ${APP.QUIZ_LIMIT}초예요.</p>
      <div class="grid grid-cols-3 gap-2 text-left mb-6">
        <div class="sheet-soft p-3"><div class="font-jua text-xl">100점</div><div class="text-sm text-gray-600">맞히면 기본 점수</div></div>
        <div class="sheet-soft p-3"><div class="font-jua text-xl">+최대 100</div><div class="text-sm text-gray-600">빨리 맞힐수록 보너스</div></div>
        <div class="sheet-soft p-3"><div class="font-jua text-xl">+최대 50</div><div class="text-sm text-gray-600">연속으로 맞히면 콤보</div></div>
      </div>
      <p class="mb-6">내 최고 점수 <b class="font-jua text-xl">${(r?.best||0).toLocaleString()}점</b></p>
      <div class="flex flex-wrap justify-center gap-3">
        <button class="btn btn-pen text-xl px-8 py-3" onclick="startBattle()">대결 시작!</button>
        <button class="btn" onclick="QZ.phase='end';QZ.onlyRank=true;render()">🏆 순위 보기</button>
      </div>
      <p class="text-sm text-gray-500 mt-4">키보드에서는 1, 2 숫자키로도 고를 수 있어요.</p>
    </div></div>`;
}
function startBattle(){
  const qs=shuffle(QUIZ_POOL).slice(0,APP.QUIZ_COUNT).map(q=>({...q, opts:shuffle([q.a,q.b])}));
  Object.assign(QZ,{ phase:'count', count:3, qs, idx:0, score:0, combo:0, maxCombo:0, correct:0, log:[], locked:false, onlyRank:false, saved:false });
  render(); sfx();
  const tick=()=>{ if(S.view!=='battle'||QZ.phase!=='count') return;
    QZ.count--; if(QZ.count<=0){ QZ.phase='play'; render(); return; }
    const el=$('#countNum'); if(el) el.textContent=QZ.count; sfx(); setTimeout(tick,800); };
  setTimeout(tick,800);
}
function viewBattlePlay(){
  const q=QZ.qs[QZ.idx];
  return `<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-3 mb-3 font-jua text-lg">
      <span>${QZ.idx+1} / ${QZ.qs.length}</span>
      ${QZ.combo>=2?`<span class="text-[#E0453A]">🔥 ${QZ.combo} 콤보</span>`:''}
      <span class="ml-auto text-2xl">${QZ.score.toLocaleString()}점</span>
    </div>
    <div class="flex items-center gap-3 mb-5"><div class="timer-track flex-1"><div class="timer-fill" id="tfill" style="width:100%"></div></div><span class="font-jua w-10 text-right" id="tleft">${APP.QUIZ_LIMIT}</span></div>
    <div class="sheet p-6 sm:p-8 mb-5 text-center" id="qCard">
      <p class="text-sm text-gray-500 mb-3">빈칸에 알맞은 말은?</p>
      <p class="text-2xl sm:text-3xl leading-relaxed" id="qText">${blankHtml(q.s)}</p>
      <div id="qFeed" class="h-8 mt-3 font-jua text-2xl"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      ${q.opts.map((o,k)=>`<button class="btn text-2xl py-6 qopt" data-v="${esc(o)}" onclick="quizAnswer(${k})"><span class="text-sm text-gray-400 mr-1">${k+1}</span>${esc(o)}</button>`).join('')}
    </div>
  </div>`;
}
function startQTimer(){
  stopTimer(); QZ.t0=performance.now(); QZ.locked=false;
  QT=setInterval(()=>{
    const left=Math.max(0, APP.QUIZ_LIMIT-(performance.now()-QZ.t0)/1000);
    const f=$('#tfill'); if(f){ f.style.width=(left/APP.QUIZ_LIMIT*100)+'%'; f.style.background= left<3?'#E0453A':left<6?'#F2B33D':'#5FA86A'; }
    const tl=$('#tleft'); if(tl) tl.textContent=Math.ceil(left);
    if(left<=0){ stopTimer(); quizAnswer(null); }
  },50);
}
function quizAnswer(k){
  if(QZ.phase!=='play'||QZ.locked) return; QZ.locked=true; stopTimer();
  const q=QZ.qs[QZ.idx], pick=k===null?null:q.opts[k], ok=pick===q.a;
  const left=Math.max(0, APP.QUIZ_LIMIT-(performance.now()-QZ.t0)/1000);
  let gain=0;
  if(ok){ QZ.combo++; QZ.maxCombo=Math.max(QZ.maxCombo,QZ.combo); QZ.correct++;
    gain = 100 + Math.round(100*left/APP.QUIZ_LIMIT) + Math.min(50,(QZ.combo-1)*10); QZ.score+=gain; sfx('ok'); }
  else { QZ.combo=0; sfx('no'); }
  QZ.log.push({ ...q, pick, ok, gain });
  document.querySelectorAll('.qopt').forEach(b=>{ b.disabled=true; if(b.dataset.v===q.a) b.classList.add('btn-board'); else if(b.dataset.v===pick) b.classList.add('btn-pen'); });
  $('#qText').innerHTML=blankHtml(q.s,q.a);
  $('#qFeed').innerHTML = ok ? `<span class="text-[#2F5D50]">⭕ +${gain}</span>` : `<span class="text-[#E0453A]">${k===null?'⏰ 시간 끝!':'❌ 아쉬워요'}</span>`;
  if(!ok) $('#qCard').classList.add('shake');
  setTimeout(()=>{ if(S.view!=='battle'||QZ.phase!=='play') return;
    QZ.idx++; if(QZ.idx>=QZ.qs.length){ QZ.phase='end'; finishBattle(); } else render(); }, ok?750:1400);
}
document.addEventListener('keydown',e=>{ if(S.screen==='student'&&S.view==='battle'&&QZ.phase==='play'&&(e.key==='1'||e.key==='2')) quizAnswer(+e.key-1); });
async function finishBattle(){
  $('#stMain').innerHTML=loading('점수를 저장하는 중…');
  const at=Date.now();
  await Store.set(`records/${S.id}/${uid('q')}`, { type:'quiz', at, score:QZ.score, correct:QZ.correct, total:QZ.qs.length, maxCombo:QZ.maxCombo });
  const prev=await Store.get('rank/'+S.id), c=S.cls||{};
  QZ.prevBest=prev?.best||0; QZ.newBest = QZ.score>QZ.prevBest;
  await Store.set('rank/'+S.id, { name:S.me.name, grade:c.grade||0, region:c.region||'', school:c.school||'', classId:S.me.classId||'', plays:(prev?.plays||0)+1,
    best:Math.max(QZ.score,QZ.prevBest), bestAt: QZ.newBest?at:(prev?.bestAt||at) });
  await addWrongs(S.id, QZ.log.filter(l=>!l.ok).map(l=>({ key:`q_${l.cid}_${l.i}`, data:{kind:'spell', cid:l.cid, i:l.i, s:l.s, a:l.a, b:l.b} })));
  QZ.saved=true; render();
}
async function viewBattleEnd(){
  const ranks=vals(await Store.get('rank'));
  const tab=S.rankTab||'class', c=S.cls||{};
  const filt={ grade:r=>r.grade===c.grade, region:r=>r.region===c.region, school:r=>r.region===c.region&&normSchool(r.school)===normSchool(c.school), class:r=>r.classId===S.me.classId, all:()=>true }[tab];
  const list=ranks.filter(r=>r.best>0 && filt(r)).sort((a,b)=>b.best-a.best||(a.bestAt||0)-(b.bestAt||0));
  const myIdx=list.findIndex(r=>r._id===S.id);
  const tabs=[['class','🏫 우리 반'],['school','🏫 우리 학교'],['grade',`🎒 ${c.grade||'-'}학년 전국`],['region',`📍 ${c.region||'-'} 지역`],['all','🌏 전국 전체']];
  const head = QZ.onlyRank ? `<h2 class="font-jua text-4xl mb-5">🏆 대결 순위</h2>` : `
    <div class="sheet tape p-7 text-center mb-6">
      <p class="font-jua text-xl text-gray-600">대결 끝!</p>
      <div class="score-pen text-8xl my-2">${QZ.score.toLocaleString()}<span class="text-4xl">점</span></div>
      <p class="text-lg">${QZ.correct} / ${QZ.qs.length} 정답 · 최대 ${QZ.maxCombo} 콤보</p>
      ${QZ.newBest?'<p class="mt-3"><span class="stamp text-lg">최고 기록 경신!</span></p>':`<p class="text-gray-600 mt-2">내 최고 점수 ${QZ.prevBest.toLocaleString()}점</p>`}
      <div class="flex flex-wrap justify-center gap-3 mt-6">
        <button class="btn btn-pen" onclick="startBattle()">다시 도전</button>
        ${QZ.correct<QZ.qs.length?`<button class="btn btn-hl" onclick="S.battleReview=!S.battleReview;render()">틀린 문제 보기</button>`:''}
        <button class="btn" onclick="QZ.phase='intro';render()">처음으로</button>
      </div>
      ${S.battleReview?`<div class="text-left mt-5 space-y-2">${QZ.log.filter(l=>!l.ok).map(l=>`<div class="sheet-soft p-3">${blankHtml(l.s,l.a)} <div class="text-sm mt-1"><span class="text-[#2F5D50]">⭕ ${esc(l.a)}</span>${l.pick?` <span class="text-gray-400 line-through ml-2">내 답 ${esc(l.pick)}</span>`:' <span class="text-gray-400 ml-2">시간 초과</span>'}</div></div>`).join('')}<p class="text-sm text-gray-500">틀린 문제는 오답노트에 넣어 두었어요.</p></div>`:''}
    </div>`;
  return `<div class="max-w-2xl mx-auto">${head}
    <div class="flex gap-1 scroll-x pl-2">${tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" onclick="S.rankTab='${k}';render()">${n}</button>`).join('')}</div>
    <div class="sheet p-4">
      <p class="text-sm text-gray-500 mb-3">각자의 최고 점수로 순위를 매겨요. ${myIdx>=0?`나는 <b class="text-ink">${list.length}명 중 ${myIdx+1}등</b>이에요.`:'아직 이 순위에 내 기록이 없어요.'}</p>
      ${list.length?`<ol>${list.slice(0,30).map((r,i)=>rankRow(r,i,tab)).join('')}</ol>
        ${myIdx>=30?`<div class="text-center text-gray-400 my-1">⋯</div><ol>${rankRow(list[myIdx],myIdx,tab)}</ol>`:''}`
       : '<p class="text-gray-600 py-6 text-center">아직 기록이 없어요. 첫 번째 주인공이 되어 볼까요?</p>'}
    </div>
    ${QZ.onlyRank?`<div class="mt-5"><button class="btn" onclick="QZ.phase='intro';QZ.onlyRank=false;render()">← 돌아가기</button></div>`:''}
  </div>`;
}
function rankRow(r,i,tab){
  const me=r._id===S.id, medal=['🥇','🥈','🥉'][i]||'';
  const name = (tab==='class'||me) ? r.name : maskName(r.name);
  const where = tab==='class' ? '' : `<span class="text-sm text-gray-500">${esc(r.region)} ${esc(r.school)}${tab==='school'||tab==='grade'||tab==='region'||tab==='all'?` · ${r.grade}학년`:''}</span>`;
  return `<li class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${me?'bg-[#FFE36E]':i%2?'':'bg-[#F7FAF7]'}">
    <span class="font-jua text-xl w-10 text-center">${medal||i+1}</span>
    <span class="flex-1 min-w-0"><span class="font-jua text-lg">${esc(name)}${me?' (나)':''}</span> ${where}</span>
    <span class="font-jua text-lg">${(r.best||0).toLocaleString()}</span>
  </li>`;
}
</script>

<script>
/* =====================================================================
   교사 모드
===================================================================== */
async function removeStudentAll(sid){
  for(const p of ['students','records','photos','wrong','rank','learned','srs','daily']) await Store.remove(`${p}/${sid}`);
}
async function renderTeacher(){
  const app=$('#app');
  const right=()=>`<span class="font-jua text-[#FFE36E]">${esc(S.tme?.name||'')} 선생님</span><button class="btn btn-sm" onclick="logout()">로그아웃</button>`;
  app.innerHTML=topBar('선생님 모드', right())+`<main class="max-w-5xl mx-auto px-4 py-6">${loading()}</main>`; updateBadge();
  const t=await Store.get('teachers/'+S.id);
  if(!t){ toast('교사 계정을 찾을 수 없어요','err'); logout(); return; }
  S.tme=t;
  const [classesRaw, studentsRaw]=await Promise.all([Store.get('classes'), Store.get('students')]);
  const classes=vals(classesRaw).filter(c=>c.teacherId===S.id).sort((a,b)=>a.createdAt-b.createdAt);
  const students=vals(studentsRaw);
  let inner;
  if(S.tcls && classes.find(c=>c._id===S.tcls)) inner = await teacherClassView(classes.find(c=>c._id===S.tcls), students.filter(s=>s.classId===S.tcls));
  else { S.tcls=null; inner = teacherHome(classes, students); }
  if(S.screen!=='teacher') return;
  app.innerHTML=topBar('선생님 모드', right())+`<main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-20">${inner}</main>`; updateBadge();
}
function teacherHome(classes, students){
  return `
  <h2 class="font-jua text-4xl mb-1">우리 반 관리</h2>
  <p class="text-gray-600 mb-6">반을 만들면 학생들이 가입할 때 지역 → 학교 → 반 순서로 찾을 수 있어요.</p>
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
    ${classes.map(c=>`<button class="sheet tile p-5" onclick="S.tcls='${c._id}';S.ttab='students';render()">
      <div class="text-sm text-gray-500">${esc(c.region)} · ${esc(c.school)}</div>
      <div class="font-jua text-3xl my-1">${c.grade}학년 ${c.ban}반</div>
      <div class="text-gray-600">학생 ${students.filter(s=>s.classId===c._id).length}명</div>
    </button>`).join('') || '<p class="text-gray-600 sm:col-span-3">아직 만든 반이 없어요. 아래에서 첫 반을 만들어 보세요.</p>'}
  </div>
  <form class="sheet tape p-6 max-w-2xl" onsubmit="event.preventDefault();createClass()">
    <h3 class="font-jua text-2xl mb-4">🏫 새 반 만들기</h3>
    <div class="grid sm:grid-cols-2 gap-3">
      <label><span class="label">지역</span><select id="ncRegion" class="field">${REGIONS.map(r=>`<option>${r}</option>`).join('')}</select></label>
      <label><span class="label">학교명</span><input id="ncSchool" class="field" placeholder="예: 해운대초등학교" maxlength="20"></label>
      <label><span class="label">학년</span><select id="ncGrade" class="field">${[3,4,5,6].map(g=>`<option ${g===5?'selected':''}>${g}</option>`).join('')}</select></label>
      <label><span class="label">반</span><input id="ncBan" class="field" type="number" min="1" max="30" placeholder="예: 3"></label>
    </div>
    <button class="btn btn-board mt-4">반 만들기</button>
  </form>`;
}
async function createClass(){
  const region=$('#ncRegion').value, school=$('#ncSchool').value.trim(), grade=+$('#ncGrade').value, ban=+$('#ncBan').value;
  if(!school) return toast('학교명을 써 주세요','err');
  if(!ban||ban<1) return toast('반 번호를 써 주세요','err');
  const exist=vals(await Store.get('classes')).find(c=>c.region===region&&normSchool(c.school)===normSchool(school)&&c.grade===grade&&c.ban===ban);
  if(exist) return toast('같은 학교·학년·반이 이미 있어요','err');
  const cid=uid('c');
  await Store.set('classes/'+cid, { region, school, grade, ban, teacherId:S.id, teacherName:S.tme.name, createdAt:Date.now(), custom:[] });
  toast(`${school} ${grade}학년 ${ban}반을 만들었어요`,'ok'); S.tcls=cid; S.ttab='students'; render();
}
async function teacherClassView(c, students){
  const tab=S.ttab||'students';
  const tabs=[['students','👥 학생 관리'],['records','📝 학습 기록'],['battle','⚡ 대결 순위'],['custom','🍎 받아쓰기 문제 내기']];
  let body='';
  students.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  if(tab==='students'){
    body = students.length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>이름</th><th>아이디</th><th>가입한 날</th><th class="text-right">관리</th></tr></thead><tbody>
      ${students.map(s=>`<tr><td class="font-jua text-lg">${esc(s.name)}</td><td>${esc(s._id)}</td><td>${fmtDay(s.createdAt)}</td>
        <td class="text-right whitespace-nowrap"><button class="btn btn-sm" onclick="tRename('${s._id}')">이름 바꾸기</button>
        <button class="btn btn-sm" onclick="tResetPw('${s._id}')">비밀번호 초기화</button>
        <button class="btn btn-sm btn-pen" onclick="tDelStudent('${s._id}')">삭제</button></td></tr>`).join('')}
      </tbody></table></div><p class="text-sm text-gray-500 mt-3">비밀번호를 초기화하면 <b>${APP.RESET_PW}</b>으로 바뀌어요.</p>`
      : `<p class="text-gray-600 py-6">아직 가입한 학생이 없어요. 학생들에게 ‘학생으로 들어가기 → 처음이에요’에서 <b>${esc(c.region)} → ${esc(c.school)} → ${c.grade}학년 ${c.ban}반</b>을 고르라고 안내해 주세요.</p>`;
  } else if(tab==='records'){
    const recs=await Promise.all(students.map(s=>Store.get('records/'+s._id)));
    const wrongs=await Promise.all(students.map(s=>Store.get('wrong/'+s._id)));
    const learnedAll=await Promise.all(students.map(s=>Store.get('learned/'+s._id)));
    T_RECS={}; students.forEach((s,i)=>T_RECS[s._id]=vals(recs[i]).sort((a,b)=>b.at-a.at));
    body = students.length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>이름</th><th>받아쓰기</th><th>평균</th><th>최근 받아쓰기</th><th>대결</th><th>익힌 카드</th><th>오답</th><th></th></tr></thead><tbody>
      ${students.map((s,i)=>{ const L=T_RECS[s._id], D=L.filter(r=>r.type==='dictation'), Q=L.filter(r=>r.type==='quiz');
        const avg=D.length?Math.round(D.reduce((a,r)=>a+r.score,0)/D.length):'-';
        return `<tr><td class="font-jua text-lg">${esc(s.name)}</td><td>${D.length}번</td><td>${avg}${avg==='-'?'':'점'}</td>
        <td>${D[0]?`<span class="text-[#E0453A] font-jua">${D[0].score}점</span> <span class="text-sm text-gray-500">${fmtDate(D[0].at)}</span>`:'-'}</td>
        <td>${Q.length?`${Q.length}번 · 최고 ${Math.max(...Q.map(q=>q.score)).toLocaleString()}`:'-'}</td>
        <td>${Object.keys(learnedAll[i]||{}).length} / ${CARDS.length}</td>
        <td>${Object.keys(wrongs[i]||{}).length}</td>
        <td class="text-right"><button class="btn btn-sm" onclick="tStudentRecords('${s._id}')">자세히</button></td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="text-gray-600 py-6">가입한 학생이 없어요.</p>';
  } else if(tab==='battle'){
    const ranks=vals(await Store.get('rank')).filter(r=>r.classId===c._id&&r.best>0).sort((a,b)=>b.best-a.best);
    body = ranks.length ? `<ol>${ranks.map((r,i)=>`<li class="flex items-center gap-3 px-3 py-2.5 rounded-lg ${i%2?'':'bg-[#F7FAF7]'}"><span class="font-jua text-xl w-10 text-center">${['🥇','🥈','🥉'][i]||i+1}</span><span class="flex-1 font-jua text-lg">${esc(r.name)}</span><span class="text-sm text-gray-500">${r.plays||0}번 도전</span><span class="font-jua text-lg w-24 text-right">${r.best.toLocaleString()}</span></li>`).join('')}</ol>`
      : '<p class="text-gray-600 py-6">아직 대결 기록이 없어요.</p>';
  } else {
    body = `<p class="text-gray-600 mb-3">한 줄에 한 문장씩 써 주세요. 학생이 받아쓰기에서 <b>‘선생님이 낸 문제’</b>를 고르면 이 중에서 5개가 무작위로 나와요. 급수표를 그대로 붙여 넣어도 돼요.</p>
      <textarea id="customTa" class="field font-body text-lg" rows="12" placeholder="예)&#10;가을 하늘이 높고 푸르다.&#10;친구와 사이좋게 지내요.">${esc((c.custom||[]).filter(Boolean).join('\n'))}</textarea>
      <div class="flex items-center gap-3 mt-3"><button class="btn btn-board" onclick="saveCustom('${c._id}')">문제 저장</button><span class="text-sm text-gray-500">지금 ${(c.custom||[]).filter(Boolean).length}문장</span></div>`;
  }
  return `
  <button class="btn btn-sm mb-4" onclick="S.tcls=null;render()">← 반 목록</button>
  <div class="flex flex-wrap items-end gap-3 mb-5">
    <div><div class="text-gray-500">${esc(c.region)} · ${esc(c.school)}</div><h2 class="font-jua text-4xl">${c.grade}학년 ${c.ban}반 <span class="text-xl text-gray-500">학생 ${students.length}명</span></h2></div>
    <button class="btn btn-sm btn-ghost ml-auto text-[#E0453A]" onclick="tDelClass('${c._id}')">반 삭제</button>
  </div>
  <div class="flex gap-1 scroll-x pl-2">${tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" onclick="S.ttab='${k}';render()">${n}</button>`).join('')}</div>
  <div class="sheet p-4 sm:p-5">${body}</div>`;
}
let T_RECS={};
async function tRename(sid){ const st=await Store.get('students/'+sid); const n=await askText('학생 이름 바꾸기', st?.name||''); if(!n) return;
  await Store.update('students/'+sid,{name:n}); const r=await Store.get('rank/'+sid); if(r) await Store.update('rank/'+sid,{name:n}); toast('이름을 바꿨어요','ok'); render(); }
async function tResetPw(sid){ if(!(await ask(`<b>${esc(sid)}</b> 학생의 비밀번호를 <b>${APP.RESET_PW}</b>으로 초기화할까요?`,'초기화'))) return;
  await Store.update('students/'+sid,{pw:APP.RESET_PW}); toast(`비밀번호를 ${APP.RESET_PW}으로 바꿨어요`,'ok'); }
async function tDelStudent(sid){ if(!(await ask(`<b>${esc(sid)}</b> 학생 계정과 모든 기록을 지울까요?<br><span class="text-sm text-gray-500">지우면 되돌릴 수 없어요.</span>`,'삭제',true))) return;
  await removeStudentAll(sid); toast('학생 계정을 지웠어요','ok'); render(); }
async function tDelClass(cid){ if(!(await ask('이 반을 삭제할까요?<br><span class="text-sm text-gray-500">학생 계정과 기록은 남지만, 학생들은 소속 반이 없어져요.</span>','반 삭제',true))) return;
  await Store.remove('classes/'+cid); S.tcls=null; toast('반을 삭제했어요','ok'); render(); }
async function saveCustom(cid){
  const lines=$('#customTa').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,300);
  await Store.update('classes/'+cid,{custom:lines}); toast(`${lines.length}문장을 저장했어요`,'ok'); render();
}
function tStudentRecords(sid){
  const L=T_RECS[sid]||[];
  openModal(`<h3 class="font-jua text-2xl mb-3">학습 기록</h3>
    ${L.length?`<div class="space-y-2 max-h-[60vh] overflow-auto">${L.map(r=>`
      <div class="sheet-soft p-3 flex items-center gap-3 flex-wrap">
        <span>${r.type==='quiz'?'⚡ 대결':'📝 받아쓰기'}</span><span class="text-sm text-gray-500">${fmtDate(r.at)}</span>
        <span class="font-jua ml-auto ${r.type==='quiz'?'':'text-[#E0453A]'}">${r.type==='quiz'?`${r.correct}/${r.total} · ${r.score.toLocaleString()}점`:`${r.score}점`}</span>
        ${r.type==='dictation'?`<button class="btn btn-sm" onclick="tRecordDetail('${sid}','${r._id}')">채점 보기${r.hasPhoto?' 📷':''}</button>`:''}
      </div>`).join('')}</div>`:'<p class="text-gray-600">기록이 없어요.</p>'}
    <div class="text-right mt-4"><button class="btn" onclick="closeModal()">닫기</button></div>`, true);
}
let T_EDIT=null;
async function tRecordDetail(sid,rid){
  openModal(loading(), true);
  const [r, photo]=await Promise.all([Store.get(`records/${sid}/${rid}`), Store.get(`photos/${sid}/${rid}`)]);
  if(!r){ closeModal(); return toast('기록을 찾을 수 없어요','err'); }
  T_EDIT={sid,rid,r,orig:r.items.map(i=>i.ok),photo};
  drawRecordDetail();
}
function drawRecordDetail(){
  const {r,photo}=T_EDIT, right=r.items.filter(i=>i.ok).length;
  openModal(`<div class="flex items-center gap-3 mb-3"><h3 class="font-jua text-2xl">받아쓰기 채점 (${fmtDate(r.at)})</h3><span class="ml-auto score-pen text-4xl">${right*20}점</span></div>
    <div class="grid md:grid-cols-[1fr_260px] gap-4">
      <div class="space-y-2">${r.items.map((it,i)=>`
        <div class="sheet-soft p-3">
          <div class="scroll-x mb-1">${wongoji(it.t, it.typed?diffBad(it.t,it.typed):null, true)}</div>
          ${it.typed?`<div class="text-sm text-gray-600">학생 입력: ${esc(it.typed)}</div>`:''}
          <div class="flex gap-2 mt-2"><button class="btn btn-sm ${it.ok?'btn-board':''}" onclick="T_EDIT.r.items[${i}].ok=true;drawRecordDetail()">⭕ 맞음</button><button class="btn btn-sm ${!it.ok?'btn-pen':''}" onclick="T_EDIT.r.items[${i}].ok=false;drawRecordDetail()">❌ 틀림</button></div>
        </div>`).join('')}</div>
      <div>${photo?`<img src="${photo}" alt="학생 공책 사진" class="w-full rounded-lg border-2 border-ink">`:'<div class="sheet-soft p-4 text-gray-500 text-sm">올린 사진이 없어요.</div>'}</div>
    </div>
    <div class="flex justify-end gap-2 mt-4"><button class="btn" onclick="closeModal()">닫기</button><button class="btn btn-board" onclick="saveRegrade()">채점 고친 것 저장</button></div>`, true);
}
async function saveRegrade(){
  const {sid,rid,r,orig}=T_EDIT; const correct=r.items.filter(i=>i.ok).length;
  await Store.update(`records/${sid}/${rid}`, { items:r.items, correct, score:correct*20 });
  const toWrong=[], toRight=[];
  r.items.forEach((it,i)=>{ if(orig[i] && !it.ok) toWrong.push(it); if(!orig[i] && it.ok) toRight.push(it); });
  await addWrongs(sid, toWrong.map(it=>({key:dictWrongKey(it.t), data:{kind:'dict', t:it.t}})));
  for(const it of toRight) await Store.remove(`wrong/${sid}/${dictWrongKey(it.t)}`);
  closeModal(); toast('채점을 고쳤어요','ok'); render();
}

/* =====================================================================
   관리자 모드
===================================================================== */
async function renderAdmin(){
  const app=$('#app');
  const right=`<span class="font-jua text-[#FFE36E]">관리자</span><button class="btn btn-sm" onclick="logout()">나가기</button>`;
  app.innerHTML=topBar('관리자 모드', right)+`<main class="max-w-6xl mx-auto px-4 py-6">${loading()}</main>`; updateBadge();
  const [T,C,St]=await Promise.all([Store.get('teachers'),Store.get('classes'),Store.get('students')]);
  const teachers=vals(T), classes=vals(C), students=vals(St), cmap=Object.fromEntries(classes.map(c=>[c._id,c]));
  const q=(S.adQ||'').toLowerCase();
  const fs=students.filter(s=>!q||s._id.includes(q)||s.name.toLowerCase().includes(q)||classLabel(cmap[s.classId]).toLowerCase().includes(q));
  if(S.screen!=='admin') return;
  app.innerHTML=topBar('관리자 모드', right)+`
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-20">
    <h2 class="font-jua text-4xl mb-4">🔧 시스템 관리</h2>
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="sheet-soft p-4"><div class="font-jua text-3xl">${teachers.length}</div><div class="text-sm text-gray-600">선생님</div></div>
      <div class="sheet-soft p-4"><div class="font-jua text-3xl">${classes.length}</div><div class="text-sm text-gray-600">반</div></div>
      <div class="sheet-soft p-4"><div class="font-jua text-3xl">${students.length}</div><div class="text-sm text-gray-600">학생</div></div>
    </div>
    <section class="sheet p-5 mb-6">
      <h3 class="font-jua text-2xl mb-3">🍎 선생님 계정</h3>
      ${teachers.length?`<div class="scroll-x"><table class="tbl"><thead><tr><th>아이디</th><th>비밀번호</th><th>이름</th><th>만든 반</th><th>가입한 날</th><th class="text-right">관리</th></tr></thead><tbody>
      ${teachers.map(t=>`<tr><td>${esc(t._id)}</td><td><code>${esc(t.pw)}</code></td><td>${esc(t.name)}</td>
        <td class="text-sm">${classes.filter(c=>c.teacherId===t._id).map(c=>esc(`${c.school} ${c.grade}-${c.ban}`)).join('<br>')||'-'}</td><td>${fmtDay(t.createdAt)}</td>
        <td class="text-right whitespace-nowrap"><button class="btn btn-sm" onclick="adResetPw('teachers','${t._id}')">비번 초기화</button> <button class="btn btn-sm btn-pen" onclick="adDelTeacher('${t._id}')">삭제</button></td></tr>`).join('')}
      </tbody></table></div>`:'<p class="text-gray-600">등록된 선생님이 없어요.</p>'}
    </section>
    <section class="sheet p-5 mb-6">
      <div class="flex flex-wrap items-center gap-3 mb-3"><h3 class="font-jua text-2xl">🎒 학생 계정</h3>
        <input class="field max-w-xs ml-auto" placeholder="아이디·이름·학교로 찾기" value="${esc(S.adQ||'')}" onchange="S.adQ=this.value;render()"></div>
      ${fs.length?`<div class="scroll-x"><table class="tbl"><thead><tr><th>아이디</th><th>비밀번호</th><th>이름</th><th>소속</th><th>가입한 날</th><th class="text-right">관리</th></tr></thead><tbody>
      ${fs.map(s=>`<tr><td>${esc(s._id)}</td><td><code>${esc(s.pw)}</code></td><td>${esc(s.name)}</td><td class="text-sm">${esc(classLabel(cmap[s.classId]))}</td><td>${fmtDay(s.createdAt)}</td>
        <td class="text-right whitespace-nowrap"><button class="btn btn-sm" onclick="adResetPw('students','${s._id}')">비번 초기화</button> <button class="btn btn-sm btn-pen" onclick="adDelStudent('${s._id}')">삭제</button></td></tr>`).join('')}
      </tbody></table></div>`:'<p class="text-gray-600">학생 계정이 없어요.</p>'}
    </section>
    <section class="sheet p-5 border-[#E0453A]">
      <h3 class="font-jua text-2xl mb-1 text-[#E0453A]">⚠️ 전체 데이터 초기화</h3>
      <p class="text-gray-600 mb-3">모든 선생님·반·학생 계정과 기록, 사진, 순위를 지워요. ${Store.cloud?'연결된 Firebase의 <code>'+APP.ROOT+'</code> 폴더도 함께 지워져요(다른 앱 데이터는 그대로예요).':'이 기기에 저장된 데이터가 지워져요.'}</p>
      <button class="btn btn-pen" onclick="adResetAll()">전체 초기화</button>
    </section>
  </main>`; updateBadge();
}
async function adResetPw(kind,id){ if(!(await ask(`<b>${esc(id)}</b> 비밀번호를 <b>${APP.RESET_PW}</b>으로 초기화할까요?`,'초기화'))) return; await Store.update(`${kind}/${id}`,{pw:APP.RESET_PW}); toast('초기화했어요','ok'); render(); }
async function adDelStudent(id){ if(!(await ask(`학생 <b>${esc(id)}</b> 계정과 모든 기록을 지울까요?`,'삭제',true))) return; await removeStudentAll(id); toast('지웠어요','ok'); render(); }
async function adDelTeacher(id){
  if(!(await ask(`선생님 <b>${esc(id)}</b> 계정과 이 선생님이 만든 반을 지울까요?<br><span class="text-sm text-gray-500">학생 계정은 남아요.</span>`,'삭제',true))) return;
  const cls=vals(await Store.get('classes')).filter(c=>c.teacherId===id);
  for(const c of cls) await Store.remove('classes/'+c._id);
  await Store.remove('teachers/'+id); toast('지웠어요','ok'); render();
}
async function adResetAll(){
  const v=await askText('정말 모두 지울까요? 아래에 <b>초기화</b>라고 써 주세요','', '초기화');
  if(v!=='초기화'){ if(v!==null) toast('입력이 달라서 취소했어요','err'); return; }
  await Store.resetAll(); toast('모든 데이터를 지웠어요','ok'); render();
}

/* =====================================================================
   시작
===================================================================== */
(async function boot(){
  $('#app').innerHTML=loading('준비하는 중…');
  TTS.init();
  await Store.init();
  let ses=null; try{ ses=JSON.parse(localStorage.getItem(LS_SESSION)||'null'); }catch(e){}
  if(ses?.role==='student'){ S.role='student'; S.id=ses.id; S.view='home'; go('student'); }
  else if(ses?.role==='teacher'){ S.role='teacher'; S.id=ses.id; go('teacher'); }
  else go('landing');
})();
</script>
